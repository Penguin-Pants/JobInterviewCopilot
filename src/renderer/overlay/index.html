<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file: data:; connect-src 'self'; media-src 'self' file:; object-src 'none'; frame-src 'none'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview CoPilot Overlay</title>
    <!--
      The overlay's styling lives in `Overlay.tsx`'s `./styles.css` import, so
      Tailwind can see it and so the colours are the ones `theme.ts` computes
      (FR-093, FR-094). Only the transparent ground stays here: it has to be
      right in the frame before the bundle has run, or the window flashes white
      over whatever the user is sharing.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./Overlay.tsx"></script>
  </body>
</html>

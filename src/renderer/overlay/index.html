<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file: data:; connect-src 'self'; media-src 'self' file:; object-src 'none'; frame-src 'none'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview CoPilot Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }

      /*
       * A frameless window is not movable just because it accepts mouse events.
       * Windows needs an explicit drag region, so the card carries one and the
       * controls inside it opt back out; without this the interaction toggle
       * lets the user click the overlay but never move it (FR-082, FR-084).
       */
      [data-drag-region] {
        -webkit-app-region: drag;
        cursor: move;
      }

      button,
      a,
      input,
      [data-no-drag] {
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./Overlay.tsx"></script>
  </body>
</html>
